<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de usuario</title>
    <link rel="stylesheet" href="../static/css/reg.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> <!-- SweetAlert -->
</head>
<body>
    <div class="main">
        <h1>Registro</h1>
        <h3>Digite sus datos</h3>
        <form id="registro" enctype="multipart/form-data" onsubmit="return validarFormulario(event)">
            <!-- Campos de texto -->
            <label for="nombre_usuario">Nombre</label>
            <input type="text" id="nombre_usuario" name="nombre_usuario" placeholder="Digite su Nombre" required>

            <label for="apellido1_usuario">Primer apellido</label>
            <input type="text" id="apellido1_usuario" name="apellido1_usuario" placeholder="Digite su primer apellido" required>

            <label for="apellido2_usuario">Segundo apellido</label>
            <input type="text" id="apellido2_usuario" name="apellido2_usuario" placeholder="Digite su segundo apellido" required>

            <label for="correo_usuario">Correo</label>
            <input type="email" id="correo_usuario" name="correo_usuario" placeholder="Digite su correo" required>

            <label for="contrasena_usuario">Contraseña</label>
            <input type="password" id="contrasena_usuario" name="contrasena_usuario" placeholder="Digite su contraseña" required>
            <small>La contraseña debe tener al menos 8 caracteres, incluyendo una mayúscula, un número y un carácter especial.</small>

            <!-- Foto -->
            <label for="photo">Foto</label>
            <div class="custom-file-upload">
                <label for="foto_usuario" class="custom-file-label">Seleccionar foto</label>
                <input type="file" id="foto_usuario" name="foto_usuario" accept="image/*" onchange="previewImage(event)" required>
            </div>

            <div id="image-preview-container">
                <img id="image-preview" style="display: none;" alt="Vista previa de la imagen" />
            </div>

             <div class="wrap">
                <button type="submit">Registrarse</button>
            </div>
        </form>
        <p>¿Ya estás registrado? <a href="/login" style="text-decoration: none;">Iniciar sesión</a></p>
    </div>

    <script>
        var request = new XMLHttpRequest();

        request.onload = function () {
            if (request.status == 400) {
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: 'Su registro no se pudo completar: ' + request.responseText,
                });
            } else if (request.status == 201) {
                Swal.fire({
                    icon: 'success',
                    title: 'Éxito',
                    text: 'Registro completado',
                }).then(function() {
                    window.location.href = "/login";
                });
            }
        };

        function registrar() {
            var formData = new FormData(document.getElementById('registro'));
            
            var file = formData.get('foto_usuario');
            const maxSize = 64 * 1024 * 1024; // 64 MB
            if (file && file.size > maxSize) {
                Swal.fire({
                    icon: 'error',
                    title: 'Archivo demasiado grande',
                    text: 'La imagen es demasiado pesada. Seleccione una imagen menor a 64 MB.',
                });
                return;
            }

            request.open("POST", "/cregistrarse");
            request.send(formData);
        }

        function validarFormulario(event) {
            event.preventDefault();
            
            var nombre = document.getElementById('nombre_usuario').value;
            var apellido1 = document.getElementById('apellido1_usuario').value;
            var apellido2 = document.getElementById('apellido2_usuario').value;
            var correo = document.getElementById('correo_usuario').value;
            var contrasena = document.getElementById('contrasena_usuario').value;
            var foto = document.getElementById('foto_usuario').value;

            if (!nombre || !apellido1 || !apellido2 || !correo || !contrasena || !foto) {
                Swal.fire({
                    icon: 'error',
                    title: 'Campos incompletos',
                    text: 'Por favor, complete todos los campos del formulario.',
                });
                return false;
            }

            if (!validarContrasena(contrasena)) {
                Swal.fire({
                    icon: 'error',
                    title: 'Contraseña inválida',
                    text: 'La contraseña debe tener al menos 8 caracteres, incluyendo una mayúscula, un número y un carácter especial.',
                });
                return false;
            }

            confirmarRegistro();
            return false;
        }

        function confirmarRegistro() {
            Swal.fire({
                title: '¿Deseas guardar?',
                text: "Estás a punto de registrarte.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Sí, registrar',
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed) {
                    registrar();
                }
            });
        }

        function validarContrasena(password) {
            var regex = /^(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*()_+{}|:;<>,.?/~`-]).{8,}$/;
            return regex.test(password);
        }

        function previewImage(event) {
            const imagePreview = document.getElementById('image-preview');
            const file = event.target.files[0];
            const reader = new FileReader();

            reader.onload = function() {
                imagePreview.src = reader.result;
                imagePreview.style.display = 'block';
            };

            if (file) {
                reader.readAsDataURL(file);
            }
        }
    </script>
</body>
</html>
